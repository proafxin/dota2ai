[project]
name = "dota2ai"
version = "0.1.0"
description = "AI for Dota 2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.16",
    "jupyter>=1.1.1",
    "pandas>=2.2.3",
    "torch>=2.6.0",
    "types-aiofiles>=24.1.0.20250326",
    "types-requests>=2.32.0.20250328",
]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "pytest>=8.3.5",
    "tox-uv>=1.25.0",
]
formatting = [
    "bandit>=1.8.3",
    "ruff>=0.11.4",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 120
